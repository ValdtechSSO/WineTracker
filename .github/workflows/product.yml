name: Product checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Hosts/Web/package-lock.json

      - name: Restore .NET dependencies
        run: dotnet restore WineTracker.slnx

      - name: Build .NET
        run: dotnet build WineTracker.slnx --configuration Release --no-restore

      - name: Test .NET
        run: dotnet test WineTracker.slnx --configuration Release --no-build

      - name: Install web dependencies
        run: npm ci --prefix src/Hosts/Web

      - name: Test and build web
        run: npm run check --prefix src/Hosts/Web
